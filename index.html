<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>AsKa · Kartu Asesmen</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; }
  body { display: flex; flex-direction: column; background: #f4f4f9; color: #19344c; font: 14px Arial, sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid #d8e0e8; }
  .brand { font-size: 16px; font-weight: 700; }
  .brand span { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: #627588; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .centered { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 28px 18px; }
  h1, h2 { margin: 0 0 12px; }
  h1 { font-size: 26px; }
  h2 { font-size: 22px; }
  p { max-width: 590px; margin: 0 0 20px; line-height: 1.6; }
  .muted { color: #5b7186; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
  button { display: inline-flex; justify-content: center; align-items: center; padding: 10px 15px; border: 1px solid #b9c9d8; border-radius: 8px; color: #254b6a; background: #fff; font: 14px Arial, sans-serif; cursor: pointer; }
  button:hover { background: #edf3f9; }
  button:disabled { cursor: default; opacity: .5; }
  .primary { border-color: #4285f4; color: #fff; background: #4285f4; }
  .primary:hover { background: #3367d6; }
  #start-button { padding: 15px 30px; font-size: 18px; box-shadow: 0 4px 6px #0000001a; }
  :focus-visible { outline: 2px solid #245f9e; outline-offset: 3px; }
  .status { flex-shrink: 0; max-width: none; margin: 0; padding: 8px 18px; font-size: 12px; background: #e9f0f8; color: #425e77; }
  .status[data-state="ready"] { background: #e7f4eb; color: #226040; }
  .status[data-state="blocked"] { background: #fff2dc; color: #79561f; }
  iframe { flex: 1; width: 100%; min-height: 420px; border: 0; background: #f4f4f9; }
  .setup { width: min(620px, calc(100% - 32px)); margin: 32px auto; padding: 24px; border: 1px solid #d7e1ea; border-radius: 10px; background: #fff; }
  .setup label { display: block; font-size: 13px; font-weight: 600; }
  .setup input { display: block; width: 100%; margin: 7px 0 13px; padding: 11px; border: 1px solid #bbc9d5; border-radius: 6px; font: 14px Arial, sans-serif; }
  .setup code { overflow-wrap: anywhere; }
  .error { margin: 14px 0 0; color: #9b322c; }
  @media (max-width: 500px) { header { padding: 12px 14px; } header .actions { justify-content: flex-start; } button { font-size: 13px; } }
</style>
</head>
<body>
<header id="app-toolbar" hidden>
  <div class="brand">AsKa<span>SMP Negeri 15 Balikpapan</span></div>
  <div class="actions">
    <button id="reload" type="button">Coba lagi di halaman ini</button>
    <button id="change-url" type="button">Tautan web app</button>
  </div>
</header>
<main>
  <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  <section id="landing-page" class="centered">
    <h1>Selamat Datang</h1>
    <p class="muted">Silakan buat kartu asesmen SMP Negeri 15 Balikpapan.</p>
    <div class="actions">
      <button id="start-button" class="primary" type="button" disabled>Buka Aplikasi Layar Penuh</button>
    </div>
  </section>
  <section id="setup" class="setup" hidden>
    <h2>Hubungkan web app</h2>
    <p class="muted">Masukkan URL deployment Apps Script yang berakhiran <code>/exec</code>.</p>
    <form id="connection-form">
      <label>URL web app Apps Script<input id="webapp-url" type="url" required placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false" autocomplete="off"></label>
      <button class="primary" type="submit">Simpan tautan</button>
    </form>
    <p id="origin-note" class="muted" style="margin:16px 0 0"></p>
    <p id="connection-error" class="error" role="alert"></p>
  </section>
  <section id="connection-state" class="centered" role="status" aria-live="polite" hidden>
    <h2 id="connection-title">Menghubungkan aplikasi…</h2>
    <p id="connection-description" class="muted">Sedang memuat aplikasi dari Apps Script.</p>
  </section>
  <iframe id="app-frame" title="Aplikasi kartu asesmen SMP Negeri 15 Balikpapan" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen" hidden></iframe>
</main>
<noscript>Aktifkan JavaScript untuk membuka aplikasi.</noscript>
<script>
'use strict';
// URL deployment sekolah. Perbarui jika membuat deployment dengan URL baru.
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxJXyEDe0yqxmCKiUy_0MMq0bLBEWWRtmLFQOTeOPmsAJdz5VRoroGxOq5lGK3idKJV/exec';
const storageKey = 'kartu-ujian-webapp-v1';
const frame = document.getElementById('app-frame');
const setup = document.getElementById('setup');
const statusLine = document.getElementById('status');
const input = document.getElementById('webapp-url');
let activeUrl = '', channel = '', ready = false, loadTimer;

function canonicalUrl(value) {
  let url;
  try { url = new URL(String(value).trim()); }
  catch (error) { throw new Error('Masukkan URL web app Apps Script yang lengkap.'); }
  if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' || url.port || url.username || url.password || !/^\/(?:a\/[a-zA-Z0-9.-]+\/)?macros\/s\/[a-zA-Z0-9_-]{10,}\/exec$/.test(url.pathname)) {
    throw new Error('Gunakan URL deployment https://script.google.com/…/exec.');
  }
  url.search = ''; url.hash = '';
  return url.href;
}
function report(text, state) {
  statusLine.textContent = text;
  statusLine.dataset.state = state || 'waiting';
  statusLine.hidden = false;
}
function showSetup(error) {
  setup.hidden = false;
  input.value = activeUrl || input.value;
  document.getElementById('connection-error').textContent = error || '';
  document.getElementById('origin-note').textContent = 'Origin untuk githubOrigins di Code.gs adalah ' + window.location.origin;
}
function prepare(value) {
  activeUrl = canonicalUrl(value);
  document.getElementById('start-button').disabled = false;
  setup.hidden = true;
  document.getElementById('connection-error').textContent = '';
  try { localStorage.setItem(storageKey, activeUrl); } catch (error) { /* Halaman tetap memakai URL aktif. */ }
}
function newChannel() {
  return Array.from(crypto.getRandomValues(new Uint8Array(32)), function(value) { return value.toString(16).padStart(2, '0'); }).join('');
}
function showBlockedState() {
  if (ready) return;
  document.getElementById('connection-state').hidden = false;
  document.getElementById('connection-title').textContent = 'Aplikasi belum berhasil ditampilkan di sini';
  document.getElementById('connection-description').textContent = 'Periksa akun Google, izin deployment, dan pengaturan browser, lalu pilih Coba lagi di halaman ini.';
  report('Koneksi aplikasi belum berhasil. Silakan coba lagi.', 'blocked');
}
function mount(value) {
  prepare(value);
  if (window.top !== window.self) throw new Error('Buka halaman GitHub Pages ini langsung di tab browser.');
  if (window.location.protocol !== 'https:') throw new Error('Buka versi HTTPS GitHub Pages untuk menghubungkan aplikasi.');
  channel = newChannel(); ready = false; clearTimeout(loadTimer);
  const embedded = new URL(activeUrl);
  embedded.searchParams.set('embed', '1');
  embedded.searchParams.set('parentOrigin', window.location.origin);
  embedded.searchParams.set('channel', channel);
  document.getElementById('landing-page').hidden = true;
  document.getElementById('app-toolbar').hidden = false;
  document.getElementById('connection-state').hidden = false;
  document.getElementById('connection-title').textContent = 'Menghubungkan aplikasi…';
  document.getElementById('connection-description').textContent = 'Sedang memuat aplikasi dari Apps Script.';
  frame.hidden = true;
  frame.src = embedded.href;
  report('Menghubungkan aplikasi ke Apps Script…');
  loadTimer = setTimeout(showBlockedState, 12000);
}
function requestScreen() {
  const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
  if (!request) return;
  try {
    const result = request.call(document.documentElement);
    if (result && typeof result.catch === 'function') result.catch(function() {});
  } catch (error) { /* Aplikasi dapat dibuka pada ukuran jendela biasa. */ }
}
function googleFrameSource(event) {
  try {
    const origin = new URL(event.origin), host = origin.hostname;
    if (origin.protocol !== 'https:' || !(host === 'script.google.com' || host === 'script.googleusercontent.com' || host.endsWith('.googleusercontent.com'))) return false;
    let source = event.source;
    // Google memakai beberapa lapis iframe. Pastikan pesan berasal dari turunan frame aplikasi.
    for (let depth = 0; source && depth < 5; depth++) {
      if (source === frame.contentWindow) return true;
      const parent = source.parent;
      if (parent === source) break;
      source = parent;
    }
  } catch (error) { return false; }
  return false;
}
window.addEventListener('message', function(event) {
  const data = event.data;
  if (!data || !channel || data.channel !== channel || !googleFrameSource(event)) return;
  if (data.type === 'kartu-ujian:frame-ready') event.source.postMessage({type:'kartu-ujian:host-ready', channel:channel}, event.origin);
  if (data.type === 'kartu-ujian:app-ready') {
    ready = true; clearTimeout(loadTimer);
    document.getElementById('connection-state').hidden = true;
    frame.hidden = false;
    report('Aplikasi terhubung.', 'ready');
  }
});
document.getElementById('start-button').addEventListener('click', function() {
  try { mount(activeUrl); requestScreen(); } catch (error) { showSetup(error.message); }
});
document.getElementById('reload').addEventListener('click', function() {
  try { mount(activeUrl); } catch (error) { showSetup(error.message); }
});
document.getElementById('change-url').addEventListener('click', function() { showSetup(); input.focus(); });
document.getElementById('connection-form').addEventListener('submit', function(event) {
  event.preventDefault();
  try { prepare(input.value); } catch (error) { showSetup(error.message); }
});
let saved = '';
try { saved = localStorage.getItem(storageKey) || ''; } catch (error) { /* Pengaturan dalam kode tetap tersedia. */ }
try {
  if (WEBAPP_URL.trim() || saved) prepare(WEBAPP_URL.trim() || saved);
  else showSetup();
} catch (error) { showSetup(error.message); }
</script>
</body>
</html>
